[package]
name = "sudoku-solver"
version = "1.0.0"
description = "Sudoku Solver desktop app"
authors = ["ccharafeddine"]
license = "MIT"
edition = "2021"

[lib]
name = "sudoku_solver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
# Small, fast binary; the solvers run in the webview's worker.
lto = true
codegen-units = 1
opt-level = "s"
strip = true
